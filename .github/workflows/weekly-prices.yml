name: Actualizar precios semanalmente

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # El scraping completo ronda los 55 min (Amazon ~12, Firecrawl ~27 con la
    # caché de URLs, Decathlon ~6): 90 deja margen sin rozar el límite.
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium y Firefox (Amazon y Decathlon)
        run: npx playwright install --with-deps chromium firefox
      - name: Actualizar Amazon
        run: npx tsx scripts/scrape-amazon.ts
      - name: Actualizar tiendas con Firecrawl
        run: npm run scrape:firecrawl -- --refresh
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      - name: Actualizar Decathlon
        run: npx tsx scripts/scrape-decathlon.ts
      - name: Validar ofertas (rechazar productos equivocados)
        run: npx tsx scripts/validate-match.ts
      - name: Crear snapshot histórico
        run: npx tsx scripts/snapshot-prices.ts
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Estrategia: los datos scrapeados en CI son los más frescos, así que
          # SIEMPRE ganan. Se guardan fuera del repo, se parte del último main
          # (que puede haber avanzado durante el scraping) y se vuelcan encima.
          # Esto evita los errores de 'fetch first' y los conflictos de rebase
          # con el working tree sucio.
          mkdir -p /tmp/price-data
          [ -f src/data/firecrawl-ficha-urls.json ] || echo '{}' > src/data/firecrawl-ficha-urls.json
          cp src/data/real-offers.json src/data/real-offers-stores.json src/data/real-offers-decathlon.json /tmp/price-data/
          cp src/data/firecrawl-ficha-urls.json /tmp/price-data/
          cp -r src/data/price-history /tmp/price-data/
          git fetch origin
          git checkout -f -B ci-tmp origin/main
          cp /tmp/price-data/real-offers.json /tmp/price-data/real-offers-stores.json /tmp/price-data/real-offers-decathlon.json src/data/
          cp /tmp/price-data/firecrawl-ficha-urls.json src/data/
          cp -r /tmp/price-data/price-history/. src/data/price-history/
          git add src/data/real-offers.json src/data/real-offers-stores.json src/data/real-offers-decathlon.json src/data/firecrawl-ficha-urls.json src/data/price-history
          git diff --cached --quiet && echo "Sin cambios de precios" || git commit -m "chore(data): actualizar precios semanales"
          git push origin ci-tmp:main