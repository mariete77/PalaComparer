name: Actualizar precios semanalmente

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium y Firefox (Amazon y Decathlon)
        run: npx playwright install --with-deps chromium firefox
      - name: Actualizar Amazon
        run: npx tsx scripts/scrape-amazon.ts
      - name: Actualizar tiendas con Firecrawl
        run: npm run scrape:firecrawl -- --refresh
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      - name: Actualizar Decathlon
        run: npx tsx scripts/scrape-decathlon.ts
      - name: Crear snapshot histórico
        run: npx tsx scripts/snapshot-prices.ts
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Integrar lo que haya podido llegar a main durante el scraping
          # (pushes manuales, deploys) antes de añadir nuestros cambios.
          git pull --rebase origin main
          git add src/data/real-offers.json src/data/real-offers-stores.json src/data/real-offers-decathlon.json src/data/price-history
          git diff --cached --quiet && echo "Sin cambios de precios" || git commit -m "chore(data): actualizar precios semanales"
          git push